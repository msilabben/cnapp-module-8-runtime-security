#
# A Simple, and totally Insecure, Web Application
# 
# Ingress => Deployment => Service 
#
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: 
  name: simple-web-application-ingress
  annotations: 
    nginx.ingress.kubernetes.io/rewrite-target:  /
  namespace: app-01
spec: 
  ingressClassName: nginx
  rules: 
  - http: 
      paths:
      - path: /
        pathType: Prefix 
        backend: 
          service: 
            name: simple-web-application-svc
            port: 
              number: 5005
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-web-application
  labels: 
    app.kubernetes.io/name: simple-web-application
  namespace: app-01
spec: 
  replicas: 1
  selector: 
    matchLabels: 
      app.kubernetes.io/name: simple-web-application
  template:
    metadata: 
      labels: 
        app.kubernetes.io/name: simple-web-application
        k8s-app: web-applications
    spec: 
      # NOTE: access to worker node process IDs - this is insecure
      hostPID: true
      hostIPC: true
      hostNetwork: true
      containers: 
      - name: simple-web-application
        image: module8registry.azurecr.io/simple-web-application:0.0.3
        ports: 
        - containerPort: 5000
        securityContext:
          privileged: true
          # NOTE: 
          #  the "privileged" flag grants all privileges (All Linux CAP, SELinux spec_t)
          # Do not use this. Remove later. 
---
apiVersion: v1
kind: Service
metadata: 
  name: simple-web-application-svc
  namespace: app-01
spec: 
  selector: 
    app.kubernetes.io/name: simple-web-application
  ports: 
    - protocol: TCP
      port: 5005
      targetPort: 5000
