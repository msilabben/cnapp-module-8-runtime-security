# Placeholder: replace with your own Falco Talon rules.
# The rules below write pod logs to the blob-backed volume mounted at /var/talon-output.

- action: Collect pod logs
  actionner: kubernetes:log
  parameters:
    tail_lines: 500
  output:
    target: local:file
    parameters:
      destination: /var/talon-output

- rule: Shell in container
  match:
    rules:
      - Terminal shell in container
  actions:
    - action: Collect pod logs
